# The recipient-calibration half of the deslop check.
#
# The tells catalogue itself -- the tiered patterns, and the shared rhythm thresholds --
# now lives in `ductus` (`ductus/data/tells.yaml`) and is read from there, so the
# read side (gauging someone else's text) and the write side (this) cannot drift
# apart. What stays here is what `ductus` deliberately does not have: a model of the
# reader. Which tiers are enforced for whom, and how many of a counted construction
# they will tolerate, is a fact about a relationship, not about prose.
#
# Tiers, defined in ductus: E near-certain artifact, W likely pattern, S common in
# human writing too. `ductus tells` prints the catalogue.
#
# Ordinary human courtesy ("I hope this finds you well", "happy to help", "sorry for
# the delay") is S at most: a reader who is not averse should never see it fail the gate.

tolerance:
  tolerant: {enforce: [E], em_dash_per_100w_max: 1.5, contrastive_max: 2, triads_max: 4}
  neutral: {enforce: [E, W], em_dash_per_100w_max: 0.7, contrastive_max: 1, triads_max: 2}
  averse: {enforce: [E, W, S], em_dash_per_100w_max: 0.3, contrastive_max: 0, triads_max: 1}
  unknown: neutral


# Messages the operator writes themself: condolence, apology for real harm, conflict,
# performance feedback. Routine apologies ("sorry for the delay", "my apologies, wrong
# file attached", "I apologize for any inconvenience", "sorry, I can't make Friday") are not.
relational:
  message: this reads as a relational message; the operator writes it
  patterns:
    - '\b(condolences?|sorry for your loss|passed away|funeral)\b'
    - '\b(i owe you an apology|please forgive me|i was wrong to|i.m (so |deeply |truly )?sorry (that i hurt|for what i said|for how i (treated|spoke|handled)))\b'
    - '\b(performance review|let you go|terminat(e|ion) (of )?your)\b'
