[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "acquaint"
version = "0.0.5"
description = "People, and what they are involved in, for AI agents: who someone is, how to reach them, how to read them, how to write to them."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["people", "profiles", "contacts", "agents", "claude-code", "writing", "deslop"]
authors = [
    { name = "Thor Whalen" },
]
# `dol` is the files store under the record store; `pyyaml` reads frontmatter and the
# identity/rule/link files; `cw` builds the CLI from the same functions `acquaint.tools`
# exposes (imported only by `__main__`).
dependencies = [
    "cw>=0.1.1,<0.2",
    "dol",
    "pyyaml",
]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/acquaint"
Repository = "https://github.com/thorwhalen/acquaint"
Documentation = "https://thorwhalen.github.io/acquaint"
Issues = "https://github.com/thorwhalen/acquaint/issues"

[project.scripts]
acquaint = "acquaint.__main__:main"
acquaint-mcp = "acquaint.mcp:main"

[project.optional-dependencies]
# MCP over stdio (Claude Desktop) is an optional surface, so its dependency is an extra.
# The CLI is this package's primary surface, which is why `cw` is a core dependency.
mcp = [
    "py2mcp",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["acquaint"]

# An allowlist, never a denylist: `.claude/skills/<name>` and `.claude/agents/<name>` are
# symlinks into `acquaint/data/`, and hatchling's walker would otherwise reach the real
# skill folders through the bridge first and prune them.
[tool.hatch.build.targets.sdist]
only-include = ["acquaint", "tests", ".github", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 90
target-version = "py311"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
    "acquaint",
]
addopts = "--doctest-modules"
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "acquaint"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.11",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.11"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
